<rect class="main" x="330" y="205" width="240" height="110" rx="22"/><text class="head" x="450" y="250" text-anchor="middle">나의 AI 환경</text><text class="sub" x="450" y="282" text-anchor="middle">목적에 맞게 선택·조합</text>
