<g class="node"><rect x="95" y="65" width="250" height="100" rx="18"/><rect x="555" y="65" width="250" height="100" rx="18"/><rect x="95" y="335" width="250" height="100" rx="18"/><rect x="555" y="335" width="250" height="100" rx="18"/></g>
