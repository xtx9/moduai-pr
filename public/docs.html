<!-- 파일명: public/docs.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의 및 문서 — 모두의 AI (moduai)</title>
  <meta name="description" content="모두의 AI 프로젝트 공식 가이드 및 마크다운 강의 뷰어">

  <!-- 파비콘 (심볼 SVG 적용) -->
  <link rel="icon" type="image/svg+xml" href="assets/images/symbol.svg">

  <!-- 스타일시트 (ChatGPT 라이트 모드) -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/docs.css">

  <!-- 코드 하이라이트 스타일 (GitHub Light / StackOverflow Light) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>

  <!-- 헤더 -->
  <header class="site-header">
    <div class="header-container">
      <div class="header-left">
        <!-- 사이드바 접기/펼치기 토글 버튼 -->
        <button class="sidebar-toggle-btn" aria-label="사이드바 열기/닫기" title="사이드바 열기/닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <a href="index.html" class="brand-logo">
          <img src="assets/images/symbol.svg" alt="moduai 심볼" class="brand-symbol">
          <span>moduai</span>
          <span class="brand-badge">Docs</span>
        </a>
      </div>

      <nav>
        <ul class="nav-links">
          <li class="nav-item"><a href="index.html">홈으로</a></li>
          <li class="nav-item"><a href="docs.html" class="active">강의 & 문서</a></li>
          <li class="nav-item"><a href="https://github.com/xtx9/moduai-pr" target="_blank">GitHub</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 문서 레이아웃 컨테이너 -->
  <div class="docs-container">
    
    <!-- 1. 좌측 사이드바 (카테고리 및 강의 목록) -->
    <aside class="docs-sidebar">
      <nav id="docs-sidebar-menu">
        <div class="docs-loader">
          <div class="spinner" style="width:20px; height:20px;"></div>
          <p style="font-size:0.82rem; color:var(--text-dim);">목차 로드 중...</p>
        </div>
      </nav>
    </aside>

    <!-- 2. 중앙 본문 마크다운 렌더링 영역 -->
    <main class="docs-content">
      <article id="docs-markdown-body" class="markdown-body">
        <!-- 마크다운 파싱 결과 동적 렌더링 -->
      </article>

      <!-- 이전 / 다음 강의 이동 버튼 -->
      <nav id="docs-pagination" class="doc-pagination" aria-label="문서 네비게이션">
        <!-- JS로 동적 생성 -->
      </nav>
    </main>

    <!-- 3. 우측 온페이지 목차 (TOC) -->
    <aside class="docs-toc">
      <div class="toc-title">현재 문서 목차</div>
      <ul id="docs-toc-list" class="toc-list">
        <!-- JS로 동적 수집 -->
      </ul>
    </aside>

  </div>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="footer-container">
      <p>© 2026 moduai (모두의 AI) — 오픈소스 마크다운 지식 플랫폼</p>
      <p><a href="index.html">홈으로 돌아가기</a></p>
    </div>
  </footer>

  <!-- 서드파티 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

  <!-- 플랫폼 스크립트 모듈 -->
  <script src="assets/js/app.js"></script>
  <script src="assets/js/diagram-renderer.js"></script>
  <script src="assets/js/markdown-viewer.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new MarkdownViewer();
      viewer.init();
    });
  </script>
</body>
</html>
