<!-- 파일명: public/docs.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업 소개 및 개발 기록 — 모두의 AI (moduai)</title>
  <meta name="description" content="모두의 AI 사업 소개, 개발 레퍼런스와 비전, 플랫폼 구축 히스토리를 담는 공간">

  <!-- 파비콘 (심볼 SVG) -->
  <link rel="icon" type="image/svg+xml" href="assets/images/symbol.svg">

  <!-- 디자인 시스템 스타일시트 -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/docs.css">

  <!-- 코드 하이라이트 스타일 (GitHub Dark 테마) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>

  <!-- 상단 글로벌 헤더 -->
  <header class="site-header">
    <div class="header-container" style="max-width: 1400px;">
      <div class="header-left">
        <!-- 사이드바 접기/펼치기 토글 버튼 -->
        <button class="sidebar-toggle-btn" aria-label="사이드바 열기/닫기" title="사이드바 열기/닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <a href="index.html" class="brand-logo">
          <img src="assets/images/symbol.svg" alt="moduai 심볼" class="brand-symbol">
          <span>moduai</span>
          <span class="brand-badge">사업·개발 기록</span>
        </a>
      </div>

      <nav class="platform-nav" aria-label="개발 플랫폼">
        <ul class="nav-links">
          <li class="nav-item"><a href="https://moduai.smartflex.org" class="btn-primary" target="_blank" rel="noopener noreferrer">개발 플랫폼 열기 ↗</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- 메인 레이아웃 래퍼 (1400px 그리드) -->
  <div class="docs-page-wrapper">
    <div class="docs-container">
      
      <!-- 1. 좌측 사이드바 (270px) -->
      <aside class="docs-sidebar">
        <nav id="docs-sidebar-menu">
          <div class="docs-loader">
            <div class="spinner" style="width:20px; height:20px;"></div>
            <p style="font-size:0.82rem; color:var(--text-dim);">목차 로드 중...</p>
          </div>
        </nav>
      </aside>

      <!-- 2. 중앙 본문 마크다운 렌더링 영역 (최대 820px 본문) -->
      <main class="docs-content">
        <article id="docs-markdown-body" class="markdown-body">
          <!-- 마크다운 파싱 결과가 여기에 동적으로 렌더링됩니다 -->
        </article>

        <!-- 이전 / 다음 문서 이동 버튼 -->
        <nav id="docs-pagination" class="doc-pagination" aria-label="문서 네비게이션">
          <!-- JS로 동적 생성 -->
        </nav>
      </main>

      <!-- 3. 우측 온페이지 목차 (230px) -->
      <aside class="docs-toc">
        <div class="toc-title">현재 문서 목차</div>
        <ul id="docs-toc-list" class="toc-list">
          <!-- JS로 헤딩 태그 자동 수집 -->
        </ul>
      </aside>

    </div>
  </div>

  <!-- 푸터 -->
  <footer class="site-footer">
    <div class="footer-container" style="max-width: 1400px;">
      <p>© 2026 moduai (모두의 AI) — 사업 소개 · 개발 레퍼런스 · 플랫폼 구축 기록</p>
      <p><a href="https://moduai.smartflex.org" target="_blank" rel="noopener noreferrer">개발 플랫폼 열기 ↗</a></p>
    </div>
  </footer>

  <!-- 서드파티 스크립트 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

  <!-- 플랫폼 스크립트 모듈 -->
  <script src="assets/js/footer.js"></script>\n  <script src="assets/js/app.js"></script>
  <script src="assets/js/diagram-renderer.js"></script>
  <script src="assets/js/markdown-viewer.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const viewer = new MarkdownViewer();
      viewer.init();
    });
  </script>
</body>
</html>
